<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a0f3a">
<title>Magic Sudoku</title>
<link rel="preload" href="fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script>
</head>
<body>
<div id="bg"></div>
<canvas id="fx"></canvas>

<!-- MENÜ -->
<section id="menu" class="screen active">
  <div class="logo">
    <div class="logo-creatures" id="logoCreatures"></div>
    <div class="banner"><h1><span data-t="t1"></span><b data-t="t2"></b></h1></div>
    <p class="tag" data-t="tag"></p>
  </div>
  <div class="menu-buttons">
    <button class="btn big" data-diff="kolay" data-t="kolay"></button>
    <button class="btn big" data-diff="orta" data-t="orta"></button>
    <button class="btn big" data-diff="zor" data-t="zor"></button>
    <button class="btn ghost" id="continueBtn" data-t="cont" hidden></button>
    <button class="btn ghost" id="howBtn" data-t="how"></button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="menu-foot">
    <label class="lang-pick">🌐 <select id="langSel" data-ta="lang"></select></label>
    <button class="link" id="privacyBtn" data-t="privacy" hidden></button>
  </div>
</section>

<!-- OYUN -->
<section id="game" class="screen">
  <header class="bar">
    <button class="icon" id="backBtn" data-ta="back"><img src="img/i_back.png" alt=""></button>
    <div class="info"><span id="diffLabel"></span><span id="timer">00:00</span></div>
    <div class="hearts" id="hearts"></div>
  </header>
  <div class="board-wrap">
    <div class="frame"><div id="board"></div></div>
  </div>
  <div class="legend" id="legend"></div>
  <footer class="tools">
    <button class="tool" id="undoBtn"><img src="img/i_undo.png" alt=""><span data-t="undo"></span></button>
    <button class="tool" id="clearBtn"><img src="img/i_erase.png" alt=""><span data-t="erase"></span></button>
    <button class="tool" id="hintBtn"><img src="img/i_hint.png" alt=""><span data-t="hint"></span><i id="hintCount">3</i></button>
    <button class="tool" id="viewBtn"><img src="img/i_view.png" alt=""><span data-t="view"></span></button>
    <button class="tool" id="soundBtn"><img src="img/i_sound.png" alt="" id="soundImg"><span></span></button>
  </footer>
</section>

<!-- KAZANDIN -->
<section id="win" class="screen">
  <div class="win-card">
    <div class="crown"></div>
    <div class="banner small"><h2></h2></div>
    <p id="winText"></p>
    <div class="win-stars" id="winStars"></div>
    <button class="btn big" id="againBtn" data-t="again"></button>
    <button class="btn ghost" id="menuBtn" data-t="menu"></button>
  </div>
</section>

<!-- NASIL OYNANIR -->
<div id="howModal" class="modal" hidden>
  <div class="modal-card">
    <h3 data-t="howT"></h3>
    <ul>
      <li data-th="h1"></li>
      <li data-th="h2"></li>
      <li data-th="h3"></li>
      <li data-th="h4"></li>
      <li data-th="h5"></li>
    </ul>
    <button class="btn" id="howClose" data-t="gotIt"></button>
  </div>
</div>

<!-- ÖDÜLLÜ REKLAM: ipucu bitince -->
<div id="adModal" class="modal" hidden>
  <div class="modal-card ad-card">
    <img class="ad-img" src="img/i_hint.png" alt="">
    <h3 data-t="adT"></h3>
    <p data-th="adTxt"></p>
    <button class="btn big" id="adWatch" data-t="watch"></button>
    <button class="btn ghost" id="adCancel" data-t="cancel"></button>
  </div>
</div>

<div id="toast"></div>
<script src="ads.js"></script>
<script src="sudoku.js"></script>
<script src="game.js"></script>
</body>
</html>
