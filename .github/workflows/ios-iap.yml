# App Store Connect: oyun içi ürünleri kurar (tools/ios/iap.cjs). Yalnız elle. Gizli değerler ios-release.yml ile aynı.
name: iOS oyun içi ürünler (App Store Connect)
on:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  iap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Ürünleri kur
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          echo "$P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          AUTHKEY="$RUNNER_TEMP/AuthKey.p8" node tools/ios/iap.cjs
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
