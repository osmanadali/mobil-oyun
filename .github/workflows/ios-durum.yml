# App Store Connect inceleme durumu: yalnız okur (tools/ios/durum.cjs). Elle ya da her sabah 09:17 (İstanbul). Gizli değerler ios-release.yml ile aynı.
name: iOS inceleme durumu
on:
  workflow_dispatch:
  schedule: [{ cron: '17 6 * * *' }]
permissions: { contents: read }
jobs:
  durum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Durumu oku
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          echo "$P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          AUTHKEY="$RUNNER_TEMP/AuthKey.p8" node tools/ios/durum.cjs
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
