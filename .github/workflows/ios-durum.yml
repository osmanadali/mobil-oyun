# App Store Connect inceleme durumu: yalnız okur (tools/ios/durum.cjs). Elle ya da her sabah 09:17 (İstanbul). Gizli değerler ios-release.yml ile aynı.
name: iOS inceleme durumu
on:
  workflow_dispatch:
    inputs:
      sertifika_iptal: { description: 'API ile oluşmuş geliştirme sertifikalarını iptal et (Codemagic imza hatası; dağıtıma dokunmaz)', type: boolean, default: false }
      play_urun: { description: 'Google Play oyun içi ürünleri (tools/android/urunler.cjs): yok / denetle / kur', type: choice, options: [yok, denetle, kur], default: yok }
  schedule: [{ cron: '17 6 * * *' }]
permissions: { contents: read }
jobs:
  durum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Durumu oku
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          echo "$P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          AUTHKEY="$RUNNER_TEMP/AuthKey.p8" node tools/ios/durum.cjs
          AUTHKEY="$RUNNER_TEMP/AuthKey.p8" APPLY=${{ inputs.sertifika_iptal && '1' || '0' }} node tools/ios/sertifika.cjs || true
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
  play-urun:
    # Google Play oyun içi ürünleri: yalnız elle (denetle: ne yapacağını yazar · kur: eksik ürünleri oluşturur, var olana dokunmaz)
    if: github.event_name == 'workflow_dispatch' && inputs.play_urun != 'yok' && inputs.play_urun != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Play ürünleri
        env: { SA: '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}', APPLY: "${{ inputs.play_urun == 'kur' && '1' || '0' }}" }
        run: node tools/android/urunler.cjs
