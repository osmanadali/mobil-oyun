# Test APK (AdMob test reklamları). Sabit indirme linki:
# https://github.com/osmanadali/mobil-oyun/releases/download/test/ray-test.apk
name: Android APK (test)
on:
  push: { branches: [main], paths: ['www/**', 'assets/**', 'tools/android/**', 'package.json', 'capacitor.config.json', '.github/workflows/apk.yml'] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - name: İkon ve açılış ekranı (assets/)
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0d1020' --iconBackgroundColorDark '#0d1020' --splashBackgroundColor '#0d1020' --splashBackgroundColorDark '#0d1020'
      - name: AdMob test App ID
        run: sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/></application>#' android/app/src/main/AndroidManifest.xml
      - name: Bildirim simgesi + minSdk 23 (Play Billing 8 gereği)
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp tools/android/ic_stat_ray.xml android/app/src/main/res/drawable/
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
          grep -n minSdkVersion android/variables.gradle
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ray-test.apk
      - uses: actions/upload-artifact@v4
        with: { name: ray-test-apk, path: ray-test.apk }
      - name: Sabit "test" sürümünü güncelle
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete test --yes --cleanup-tag || true
          gh release create test ray-test.apk --prerelease --target "$GITHUB_SHA" --title "Test sürümü" --notes "Otomatik test APK'sı (${GITHUB_SHA::7}). Reklamlar Google test reklamıdır."
