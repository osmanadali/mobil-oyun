# iOS yayın: imzalı arşiv + App Store Connect'e yükleme (TestFlight'a düşer). Ayrıntı: docs/YAYIN.md §3.2-A
# Yalnızca elle: Actions → "iOS yayın (App Store Connect)" → Run workflow (ya da: gh workflow run ios-release.yml [-f buildNumber=12])
# Gizli değerler (Settings → Secrets and variables → Actions → Secrets): APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_KEY_P8_BASE64, APPLE_TEAM_ID
# Değişkenler (aynı yer → Variables): ADMOB_APP_ID_IOS, ADMOB_INTERSTITIAL_IOS, ADMOB_REWARDED_IOS (Google test kimliği verilirse durur).
# Girilmezse AdMob'daki "Ray (iOS)" kayıtlı kimlikleri kullanılır (gizli değildir, uygulamaya gömülür); değişken girilirse o geçer.
name: iOS yayın (App Store Connect)
on:
  workflow_dispatch:
    inputs:
      buildNumber:
        description: 'Yapı numarası (boş: çalıştırma numarası). App Store Connect aynı sürümde öncekinden büyük ister.'
        type: string
        default: ''
permissions: { contents: read }
concurrency: { group: release-ios, cancel-in-progress: false }
jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION_CODE: ${{ inputs.buildNumber || github.run_number }}
      ADMOB_APP_ID_IOS: ${{ vars.ADMOB_APP_ID_IOS || 'ca-app-pub-1478688740631972~9395068810' }}
      ADMOB_INTERSTITIAL_IOS: ${{ vars.ADMOB_INTERSTITIAL_IOS || 'ca-app-pub-1478688740631972/5351882023' }}
      ADMOB_REWARDED_IOS: ${{ vars.ADMOB_REWARDED_IOS || 'ca-app-pub-1478688740631972/8249508106' }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Gizli değerleri ve değişkenleri denetle
        env:
          P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          eksik=""
          [ -n "$APPSTORE_API_KEY_ID" ]    || eksik="$eksik\n  • APPSTORE_API_KEY_ID (gizli değer: API anahtarı kimliği, 10 karakter)"
          [ -n "$APPSTORE_API_ISSUER_ID" ] || eksik="$eksik\n  • APPSTORE_API_ISSUER_ID (gizli değer: Issuer ID, UUID)"
          [ -n "$P8" ]                     || eksik="$eksik\n  • APPSTORE_API_KEY_P8_BASE64 (gizli değer: AuthKey_….p8 dosyasının base64 hâli)"
          [ -n "$APPLE_TEAM_ID" ]          || eksik="$eksik\n  • APPLE_TEAM_ID (gizli değer: Team ID, 10 karakter)"
          [ -n "$ADMOB_APP_ID_IOS" ]       || eksik="$eksik\n  • ADMOB_APP_ID_IOS (değişken, ör. ca-app-pub-1234567890123456~1234567890)"
          [ -n "$ADMOB_INTERSTITIAL_IOS" ] || eksik="$eksik\n  • ADMOB_INTERSTITIAL_IOS (değişken, ör. ca-app-pub-1234567890123456/1234567890)"
          [ -n "$ADMOB_REWARDED_IOS" ]     || eksik="$eksik\n  • ADMOB_REWARDED_IOS (değişken)"
          if [ -n "$eksik" ]; then
            printf "Eksik ayar var, iOS yapısı üretilmedi:$eksik\nNasıl eklenir: docs/YAYIN.md §3 (Settings → Secrets and variables → Actions)\n"
            echo "::error title=Eksik ayar::iOS yayını için gizli değer/değişken eksik. Günlükteki listeye ve docs/YAYIN.md §3'e bak."
            exit 1
          fi
          hata=""
          echo "$ADMOB_APP_ID_IOS" | grep -Eq '^ca-app-pub-[0-9]{16}~[0-9]{10}$' || hata="$hata\n  • ADMOB_APP_ID_IOS biçimi yanlış (ca-app-pub-…~… olmalı, '/' değil '~')"
          echo "$ADMOB_INTERSTITIAL_IOS" | grep -Eq '^ca-app-pub-[0-9]{16}/[0-9]{10}$' || hata="$hata\n  • ADMOB_INTERSTITIAL_IOS biçimi yanlış (ca-app-pub-…/… olmalı)"
          echo "$ADMOB_REWARDED_IOS" | grep -Eq '^ca-app-pub-[0-9]{16}/[0-9]{10}$' || hata="$hata\n  • ADMOB_REWARDED_IOS biçimi yanlış (ca-app-pub-…/… olmalı)"
          echo "$ADMOB_APP_ID_IOS $ADMOB_INTERSTITIAL_IOS $ADMOB_REWARDED_IOS" | grep -q 3940256099942544 && hata="$hata\n  • Google test kimliği verilmiş: yayın sürümü gerçek AdMob kimlikleri ister"
          echo "$APPLE_TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$' || hata="$hata\n  • APPLE_TEAM_ID 10 karakter (büyük harf/rakam) olmalı"
          echo "$VERSION_CODE" | grep -Eq '^[1-9][0-9]{0,9}$' || hata="$hata\n  • Yapı numarası pozitif tam sayı olmalı: $VERSION_CODE"
          if [ -n "$hata" ]; then printf "Ayar hatası:$hata\n"; echo "::error title=Ayar hatası::AdMob kimliği, Team ID ya da yapı numarası yanlış. Günlüğe bak."; exit 1; fi
          echo "Ayarlar tamam."
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Xcode 26+ seç (Capacitor 8 gereği)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version | tr "\n" " "; echo
          V=$(xcodebuild -version | awk 'NR==1{print int($2)}')
          [ "$V" -ge 26 ] || { echo "::error::Capacitor 8 Xcode 26+ ister (bulunan: $V)"; exit 1; }
      - run: npm ci --no-audit --no-fund
      - run: npx cap add ios
      - name: İkon ve açılış ekranı (assets/)
        run: npx @capacitor/assets generate --ios --iconBackgroundColor '#0d1020' --splashBackgroundColor '#0d1020' --splashBackgroundColorDark '#0d1020'
      - name: Yerel projeyi hazırla (gerçek AdMob kimlikleri, diller, yalnız iPhone + dikey, sürüm, simge)
        env: { FIREBASE_IOS_PLIST: '${{ secrets.FIREBASE_IOS_PLIST }}' }   # isteğe bağlı: yoksa ölçüm kapalı derlenir (docs/YAYIN.md §5)
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version"); export VERSION_NAME
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          tools/ios/hazirla.sh
          grep -c 'window.RAY_ADS' www/index.html
      - run: npx cap sync ios
      - name: API anahtarını çöz (yalnız bu makinede, iş bitince silinir)
        env: { P8: '${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}' }
        run: |
          echo "$P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/AuthKey.p8" || { echo "::error::APPSTORE_API_KEY_P8_BASE64 çözülemedi (base64 ile kodlanmış .p8 olmalı)"; exit 1; }
      - name: Arşivle (imzalı, App Store)
        run: |
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Ray.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$VERSION_CODE" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID" > archive.log 2>&1 \
            || { grep -E "error:" archive.log | sort -u | head -40; tail -60 archive.log; exit 1; }
          grep -E "\*\* ARCHIVE" archive.log || true
      - name: Arşivi denetle (gerçek AdMob, RAY_ADS, sürüm, diller, imza)
        run: |
          A=build/Ray.xcarchive/Products/Applications/App.app
          [ -d "$A" ] || { echo "::error::Arşivde App.app yok"; ls -R build/Ray.xcarchive | head -40; exit 1; }
          GAD=$(plutil -extract GADApplicationIdentifier raw -o - "$A/Info.plist")
          echo "GADApplicationIdentifier: $GAD"
          echo "$GAD" | grep -q 3940256099942544 && { echo "::error::Test AdMob App ID yayın arşivinde"; exit 1; }
          grep -q 'window.RAY_ADS' "$A/public/index.html" || { echo "::error::window.RAY_ADS yayın arşivinde yok (ads.js test reklamlarına düşer)"; exit 1; }
          grep -o 'window.RAY_ADS = [^<]*' "$A/public/index.html" | grep -q 3940256099942544 && { echo "::error::window.RAY_ADS içinde Google test kimliği var"; exit 1; }
          CV=$(plutil -extract CFBundleVersion raw -o - "$A/Info.plist"); SV=$(plutil -extract CFBundleShortVersionString raw -o - "$A/Info.plist")
          [ "$CV" = "$VERSION_CODE" ] || { echo "::error::CFBundleVersion $CV, beklenen $VERSION_CODE"; exit 1; }
          plutil -extract UIDeviceFamily json -o - "$A/Info.plist" | grep -qx '\[1\]' || { echo "::error::Yalnız iPhone (UIDeviceFamily [1]) değil"; exit 1; }
          [ "$(plutil -extract CFBundleDevelopmentRegion raw -o - "$A/Info.plist")" = en ] || { echo "::error::CFBundleDevelopmentRegion en değil"; exit 1; }
          for l in en tr; do
            plutil -extract CFBundleLocalizations json -o - "$A/Info.plist" | grep -q "\"$l\"" || { echo "::error::CFBundleLocalizations içinde $l yok"; exit 1; }
            plutil -extract NSUserTrackingUsageDescription raw -o - "$A/$l.lproj/InfoPlist.strings" >/dev/null || { echo "::error::$l.lproj ATT metni pakette yok"; exit 1; }
          done
          codesign -dvv "$A" 2>&1 | grep -E "Authority|TeamIdentifier" || { echo "::error::Uygulama imzası okunamadı"; exit 1; }
          echo "::notice::Ray $SV ($CV) arşivlendi"
      - name: Dışa aktar ve App Store Connect'e yükle
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath build/Ray.xcarchive -exportPath build/out \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID" > export.log 2>&1 \
            || { grep -iE "error" export.log | sort -u | head -40; tail -60 export.log; exit 1; }
          grep -iE "upload|EXPORT SUCCEEDED" export.log | tail -5 || true
          echo "::notice::Ray $VERSION_NAME ($VERSION_CODE) App Store Connect'e yüklendi. İşlenince TestFlight'ta görünür (genelde 10-30 dk)."
      - name: Arşiv günlükleri ve dSYM
        if: always()
        run: |
          mkdir -p out; cp archive.log export.log out/ 2>/dev/null || true
          [ -d build/Ray.xcarchive/dSYMs ] && ditto -c -k --keepParent build/Ray.xcarchive/dSYMs "out/ray-$VERSION_NAME-$VERSION_CODE-dSYMs.zip" || true
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: 'ray-ios-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}', path: out/, retention-days: 30, if-no-files-found: ignore }
      - name: API anahtarını sil
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
