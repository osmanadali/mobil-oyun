# iOS: imzasız simülatör derlemesi (projenin derlendiğini doğrular). App Store'a gönderim imza ister: docs/YAYIN.md
# Yalnızca elle: Actions → "iOS (simülatör)" → Run workflow (ya da: gh workflow run ios.yml)
# İsteğe bağlı değişkenler: ADMOB_APP_ID_IOS (yoksa Google test App ID), ADMOB_INTERSTITIAL_IOS, ADMOB_REWARDED_IOS
name: iOS (simülatör)
on:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: 'ios-${{ github.ref }}', cancel-in-progress: true }
jobs:
  ios:
    runs-on: macos-latest
    env:
      ADMOB_APP_ID_IOS: ${{ vars.ADMOB_APP_ID_IOS }}
      ADMOB_INTERSTITIAL_IOS: ${{ vars.ADMOB_INTERSTITIAL_IOS }}
      ADMOB_REWARDED_IOS: ${{ vars.ADMOB_REWARDED_IOS }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Xcode 26+ seç (Capacitor 8 gereği)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version | tr "\n" " "; echo
          V=$(xcodebuild -version | awk 'NR==1{print int($2)}')
          [ "$V" -ge 26 ] || { echo "::error::Capacitor 8 Xcode 26+ ister (bulunan: $V)"; exit 1; }
      - run: npm ci --no-audit --no-fund
      - run: npx cap add ios
      - name: İkon ve açılış ekranı (assets/)
        run: npx @capacitor/assets generate --ios --iconBackgroundColor '#0d1020' --splashBackgroundColor '#0d1020' --splashBackgroundColorDark '#0d1020'
      - name: Yerel projeyi hazırla (Info.plist, yalnız iPhone + dikey, sürüm, simge)
        run: tools/ios/hazirla.sh
      - run: npx cap sync ios
      - name: Derle (simülatör, imzasız)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -40; tail -60 build.log; exit 1; }
          grep -E "warning: .*Info\.plist|\*\* BUILD" build.log || true
      - name: Uygulama paketini denetle
        run: |
          A=build/Build/Products/Release-iphonesimulator/App.app
          plutil -p "$A/Info.plist" | grep -E 'CFBundleDisplayName|CFBundleShortVersionString|CFBundleVersion|MinimumOSVersion|UIDeviceFamily|GADApplicationIdentifier|ITSAppUses|NSUserTracking' -A2 | grep -v '^--'
          plutil -extract UIDeviceFamily json -o - "$A/Info.plist" | grep -qx '\[1\]' || { echo "::error::Yalnız iPhone (UIDeviceFamily [1]) değil"; exit 1; }
          echo "SKAdNetwork: $(plutil -extract SKAdNetworkItems json -o - "$A/Info.plist" | grep -o skadnetwork | wc -l | tr -d ' ')"
          grep -q 'cordova-plugin-purchase' "$A/public/cordova_plugins.js" && nm -gU "$A/App" 2>/dev/null | grep -q 'InAppPurchase' \
            && echo "Satın alma eklentisi (StoreKit) pakette" || { echo "::error::cordova-plugin-purchase iOS paketine girmemiş"; exit 1; }
          du -sh "$A"; ditto -c -k --keepParent "$A" ray-ios-simulator.zip
          echo "::notice::iOS simülatör derlemesi tamam ($(xcodebuild -version | tr '\n' ' '))"
      - uses: actions/upload-artifact@v5
        with: { name: ray-ios-simulator, path: ray-ios-simulator.zip, retention-days: 7 }
