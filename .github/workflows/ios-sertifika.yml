# Apple sertifikaları: tools/ios/sertifika.cjs. Varsayılan yalnız liste; apply=true API ile oluşmuş geliştirme sertifikalarını iptal eder (dağıtıma dokunmaz).
name: iOS sertifikalar
on:
  workflow_dispatch:
    inputs:
      apply: { description: 'Geliştirme sertifikalarını iptal et (false = yalnız liste)', type: boolean, default: false }
permissions: { contents: read }
jobs:
  sertifika:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
      - name: Listele / iptal et
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          echo "$P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          AUTHKEY="$RUNNER_TEMP/AuthKey.p8" node tools/ios/sertifika.cjs
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
