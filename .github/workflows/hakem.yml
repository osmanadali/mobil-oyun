# Her push'ta test robotu: oynanış, performans, çevrimdışı, reklam akışı, ekran sığması.
# Sonuç: Actions → çalıştırma → Summary (özet tablo) + "hakem" artifact (ekran görüntüleri).
name: Hakem (test robotu)
on:
  push: { branches: [main], paths: ['www/**', 'tools/hakem.cjs', '.github/workflows/hakem.yml'] }
  workflow_dispatch:
jobs:
  hakem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save --no-audit --no-fund playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node tools/hakem.cjs --strict
      - if: always()
        run: cat hakem-out/ozet.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: hakem, path: hakem-out }
