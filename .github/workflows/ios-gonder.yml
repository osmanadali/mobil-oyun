# App Store Connect: sürüme yapıyı bağlar ve App Review'a gönderir (tools/ios/gonder.cjs). Varsayılan yalnız denetim; apply=true gönderir.
# Gönderim her seferinde kullanıcı onayıyla yapılır. Gizli değerler ios-release.yml ile aynı.
name: iOS incelemeye gönder
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Sürüm (ör. 1.1)', type: string, default: '1.1' }
      build: { description: 'Yapı numarası (ör. 10)', type: string, required: true }
      apply: { description: 'Gönder (false = yalnız denetim)', type: boolean, default: false }
permissions: { contents: read }
jobs:
  gonder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Denetle / gönder
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          echo "$P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          AUTHKEY="$RUNNER_TEMP/AuthKey.p8" node tools/ios/gonder.cjs
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
