# App Store Connect mağaza metinleri (9 dil): tools/ios/metin.cjs. Varsayılan yalnız önizleme; apply=true yazar. Gizli değerler ios-release.yml ile aynı.
name: iOS mağaza metinleri
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Sürüm (ör. 1.1)', type: string, default: '1.1' }
      apply: { description: 'Yaz (false = yalnız ne değişeceğini göster)', type: boolean, default: false }
permissions: { contents: read }
jobs:
  metin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Metinleri karşılaştır / yaz
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          VERSION: ${{ inputs.version }}
          APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          echo "$P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          AUTHKEY="$RUNNER_TEMP/AuthKey.p8" node tools/ios/metin.cjs
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
