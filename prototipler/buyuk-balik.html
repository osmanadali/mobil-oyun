<title>Büyük Balık</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: tek ekran lagün — üstte bölüm ve kural, ortada deniz tahtası, başparmak bölgesinde düğmeler */
:root {
  color-scheme: dark;
  --sea-0: #052630;
  --sea-1: #0a4553;
  --water: #0e5363;
  --water-hi: #136577;
  --ink: #e8f6f3;
  --ink-dim: #9fc8c5;
  --foam: #d6fff3;
  --coral: #ff8a6b;
  --sand: #f3d58a;
  --f1: #f7cf4a; --f1d: #d6a823;
  --f2: #f59a3e; --f2d: #d4771c;
  --f3: #ef6b5b; --f3d: #c94a3d;
  --f4: #a274e0; --f4d: #7e51bd;
  --f5: #4a8ff0; --f5d: #2f6ccc;
  --fish-ink: #14323b;
  --display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
html, body { height: 100%; }
body {
  background-color: var(--sea-0);
  background-image:
    radial-gradient(120% 60% at 50% -12%, rgba(64, 196, 196, .28) 0%, transparent 62%),
    linear-gradient(180deg, var(--sea-1) 0%, var(--sea-0) 78%);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  box-sizing: border-box;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 12px;
}
header { display: flex; align-items: center; gap: 6px; }
.nav {
  width: 40px; height: 40px; border-radius: 12px; border: 0;
  background: transparent; color: var(--ink-dim);
  font: 700 26px/1 var(--display); cursor: pointer;
}
.nav:disabled { opacity: .25; cursor: default; }
.lvl { font: 800 22px/1 var(--display); letter-spacing: .01em; white-space: nowrap; }
.lvl small { font: 600 13px/1 var(--body); color: var(--sand); letter-spacing: .12em; margin-left: 6px; }
.spacer { flex: 1; }
.count { font: 600 14px/1 var(--body); color: var(--ink-dim); white-space: nowrap; }
.count b { font: 800 18px/1 var(--display); color: var(--ink); }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 0;
  background: rgba(214, 255, 243, .07); color: var(--ink-dim);
  display: grid; place-items: center; cursor: pointer;
}
.icon-btn svg { width: 20px; height: 20px; }
.rule { margin: 0; font-size: 15px; line-height: 1.35; color: var(--ink-dim); text-wrap: balance; }
.rule b { color: var(--ink); font-weight: 700; }
.tag {
  font: 700 10px/1 var(--body); letter-spacing: .14em; text-transform: uppercase;
  color: var(--sea-0); background: var(--sand); border-radius: 6px; padding: 4px 6px;
}

#area { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
#board {
  position: relative; touch-action: none;
  border-radius: calc(var(--cs) * .28);
  box-shadow: 0 0 0 10px rgba(214, 255, 243, .035), 0 24px 60px rgba(0, 0, 0, .25);
  transition: box-shadow .3s;
}
#board.stuck { box-shadow: 0 0 0 10px rgba(255, 138, 107, .16), 0 24px 60px rgba(0, 0, 0, .25); }
.cell { position: absolute; left: 0; top: 0; width: var(--cs); height: var(--cs); }
.cell::before {
  content: ""; position: absolute; inset: 4%;
  border-radius: 24%;
  background: linear-gradient(180deg, var(--water-hi), var(--water));
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .14);
  transition: background .3s;
}
#board.stuck .cell::before { background: linear-gradient(180deg, #5b4a52, #47404a); }
.cell.t::after, .cell.h::after {
  content: ""; position: absolute; inset: 9%;
  border-radius: 50%;
  border: 3px solid var(--foam);
  opacity: .85;
  animation: ring 1s ease-in-out infinite;
}
.cell.h::after { border-color: var(--coral); border-width: 4px; }
.cell.go::after { opacity: 1; border-width: 5px; animation: none; }
@keyframes ring { 0%, 100% { transform: scale(.9); opacity: .55; } 50% { transform: scale(1.02); opacity: .95; } }

.fish {
  position: absolute; left: 0; top: 0; z-index: 2;
  width: var(--cs); height: var(--cs);
  display: grid; place-items: center;
  transition: transform .2s cubic-bezier(.3, .8, .3, 1);
  pointer-events: none;
}
.fish.drag { transition: none; z-index: 4; }
.fish .fb { position: relative; width: calc(var(--cs) * var(--k)); aspect-ratio: 100 / 70; transition: transform .15s, opacity .18s, filter .15s; }
.fish .bob { position: absolute; inset: 0; animation: bob 3.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
.fish svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; transition: transform .18s; }
.fish[data-face="r"] svg { transform: scaleX(-1); }
.fish .body { fill: var(--c); }
.fish .tail, .fish .fin { fill: var(--cd); }
.fish .belly { fill: #fff; opacity: .2; }
.fish .eye { fill: #fff; }
.fish .pupil { fill: var(--fish-ink); }
.fish .num {
  position: absolute; left: 44%; top: 55%;
  transform: translate(-50%, -50%);
  font: 800 calc(var(--cs) * var(--k) * .4)/1 var(--display);
  color: var(--fish-ink);
}
.fish[data-face="r"] .num { left: 56%; }
.s1 { --k: .56; --c: var(--f1); --cd: var(--f1d); }
.s2 { --k: .68; --c: var(--f2); --cd: var(--f2d); }
.s3 { --k: .8; --c: var(--f3); --cd: var(--f3d); }
.s4 { --k: .92; --c: var(--f4); --cd: var(--f4d); }
.s5 { --k: 1.02; --c: var(--f5); --cd: var(--f5d); }
.s4 .num, .s5 .num { color: #fff; }
.fish.sel .fb { transform: scale(1.1); filter: drop-shadow(0 0 10px rgba(214, 255, 243, .55)); }
.fish.hint .fb { filter: drop-shadow(0 0 12px rgba(255, 138, 107, .9)); }
.fish.gone .fb { transform: scale(0) rotate(-20deg); opacity: 0; transition: transform .18s ease-in, opacity .18s; }
.fish.chomp .fb { animation: chomp .3s ease-out; }
.fish.pop .fb { animation: popin .28s ease-out; }
.fish.wig .fb { animation: wig .32s; }
.fish.happy .fb { animation: happy .9s ease-in-out 2; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3%); } }
@keyframes chomp { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
@keyframes popin { 0% { transform: scale(0); } 70% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes wig { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
@keyframes happy { 0%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-18%) rotate(-8deg); } 60% { transform: translateY(0) rotate(6deg); } }

.fx { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.bub {
  position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px;
  border-radius: 50%; border: 2px solid var(--foam); opacity: .9;
  animation: rise .8s ease-out forwards;
}
@keyframes rise { to { transform: translate(var(--bx), var(--by)) scale(.4); opacity: 0; } }
.finger {
  position: absolute; left: 0; top: 0; width: 36px; height: 36px; margin: -18px 0 0 -18px;
  border-radius: 50%; background: rgba(255, 255, 255, .5);
  box-shadow: 0 0 0 7px rgba(255, 255, 255, .16);
  animation: finger 1.8s ease-in-out infinite;
  z-index: 6; pointer-events: none;
}
@keyframes finger {
  0% { transform: translate(var(--x0), var(--y0)) scale(1.15); opacity: 0; }
  15% { transform: translate(var(--x0), var(--y0)) scale(1); opacity: 1; }
  65% { transform: translate(var(--x1), var(--y1)) scale(1); opacity: 1; }
  85%, 100% { transform: translate(var(--x1), var(--y1)) scale(1.15); opacity: 0; }
}

.stuck-msg {
  margin: 0; align-self: center;
  font-size: 14px; font-weight: 600; color: var(--ink);
  background: rgba(255, 138, 107, .18); border: 1px solid rgba(255, 138, 107, .45);
  border-radius: 999px; padding: 8px 14px; text-align: center;
}
.dock { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.btn {
  height: 58px; border-radius: 16px;
  border: 1px solid rgba(214, 255, 243, .14);
  background: rgba(214, 255, 243, .07); color: var(--ink);
  font: 700 15px/1 var(--body);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  cursor: pointer;
}
.btn svg { width: 22px; height: 22px; }
.btn:disabled { opacity: .35; cursor: default; }
.btn.hintb { border-color: rgba(255, 138, 107, .5); }
.btn.pulse { animation: pulse 1s ease-in-out infinite; border-color: var(--coral); background: rgba(255, 138, 107, .2); }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
button:focus-visible { outline: 3px solid var(--sand); outline-offset: 2px; }

.win {
  display: grid; gap: 10px; text-align: center;
  background: rgba(214, 255, 243, .07); border: 1px solid rgba(214, 255, 243, .14);
  border-radius: 20px; padding: 14px 14px 12px;
}
.win h2 { margin: 0; font: 800 26px/1.1 var(--display); text-wrap: balance; }
.stars { font: 800 34px/1 var(--display); letter-spacing: .12em; color: rgba(214, 255, 243, .2); }
.stars .on { color: var(--sand); }
.checks { display: flex; justify-content: center; gap: 16px; font-size: 13px; color: var(--ink-dim); flex-wrap: wrap; }
.checks .ok { color: var(--foam); }
.next {
  height: 56px; border: 0; border-radius: 16px; cursor: pointer;
  background: var(--sand); color: var(--sea-0);
  font: 800 19px/1 var(--display);
}
@media (prefers-reduced-motion: reduce) {
  .fish .bob, .cell.t::after, .cell.h::after, .btn.pulse, .finger { animation: none; }
  .finger { transform: translate(var(--x0), var(--y0)); }
}
</style>

<div class="app">
  <header>
    <button class="nav" id="prev" aria-label="Önceki bölüm">‹</button>
    <div class="lvl">Bölüm <span id="lvn">1</span><small id="lvs"></small></div>
    <button class="nav" id="next" aria-label="Sonraki bölüm">›</button>
    <span class="spacer"></span>
    <span class="count"><b id="cnt">2</b> balık</span>
    <button class="icon-btn" id="snd" aria-label="Sesi kapat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="sndw" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
  </header>
  <p class="rule"><b>Büyük balık yanındaki küçük balığı yer.</b> Tahtada tek balık kalsın. <span class="tag">prototip</span></p>

  <div id="area"><div id="board"></div></div>

  <p class="stuck-msg" id="stuck" hidden>Bu tahta artık çözülmez. Bir hamle geri al.</p>

  <div class="dock" id="dock">
    <button class="btn" id="undo" aria-label="Geri al">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      Geri al
    </button>
    <button class="btn" id="reset" aria-label="Baştan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      Baştan
    </button>
    <button class="btn hintb" id="hint" aria-label="İpucu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
      İpucu
    </button>
  </div>

  <div class="win" id="win" hidden>
    <h2 id="wint">Tek balık kaldı!</h2>
    <div class="stars" id="wstars" aria-label="Yıldız"></div>
    <div class="checks"><span id="c1">İpucusuz</span><span id="c2">Geri almadan</span></div>
    <button class="next" id="nextb">Sonraki bölüm</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const boardEl = $('#board'), areaEl = $('#area');

// ---------- kayıt ----------
const KEY = 'buyukbalik.v1';
const store = { level: 1, best: {}, sound: true };
try { Object.assign(store, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {} };

// ---------- tohumlu rastgele ----------
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// ---------- tahta çözümleme ----------
function makeNb(cols, rows) {
  const nb = [];
  for (let i = 0; i < cols * rows; i++) {
    const x = i % cols, y = (i / cols) | 0, l = [];
    if (x > 0) l.push(i - 1); if (x < cols - 1) l.push(i + 1);
    if (y > 0) l.push(i - cols); if (y < rows - 1) l.push(i + cols);
    nb.push(l);
  }
  return nb;
}
function moves(s, nb) {
  const m = [];
  for (let i = 0; i < s.length; i++) { const v = s[i]; if (!v) continue; for (const j of nb[i]) if (s[j] && s[j] < v) m.push([i, j]); }
  return m;
}
const apply = (s, [i, j]) => { const t = s.slice(); t[j] = t[i]; t[i] = 0; return t; };
const count = s => { let c = 0; for (const v of s) if (v) c++; return c; };
// rastgele oynayan birinin kazanma olasılığı (0 = çözülmez)
function analyzer(nb) {
  const memo = new Map();
  const p = s => {
    const k = s.join(''); let r = memo.get(k);
    if (r !== undefined) return r;
    if (count(s) === 1) r = 1;
    else { const m = moves(s, nb); if (!m.length) r = 0; else { let a = 0; for (const mv of m) a += p(apply(s, mv)); r = a / m.length; } }
    memo.set(k, r); return r;
  };
  return p;
}
// "hep en büyük balık yesin" tuzağa düşüyor mu
function greedyFails(s, nb) {
  for (let t = s; ;) {
    const m = moves(t, nb);
    if (!m.length) return count(t) > 1;
    let b = m[0]; for (const mv of m) if (t[mv[0]] > t[b[0]]) b = mv;
    t = apply(t, b);
  }
}

// ---------- bölümler ----------
const HAND = [
  { cols: 2, rows: 1, s: [2, 1] },
  { cols: 3, rows: 1, s: [3, 2, 1] },
  { cols: 3, rows: 2, s: [3, 1, 2, 0, 1, 0] },
];
function spec(n) {
  const fish = Math.min(12, 4 + Math.floor((n - 4) * 0.6));
  const g = fish <= 5 ? [3, 3] : fish <= 8 ? [4, 4] : fish <= 10 ? [4, 5] : [5, 5];
  return { fish, cols: g[0], rows: g[1], maxS: fish <= 4 ? 3 : fish <= 8 ? 4 : 5, target: Math.max(0.03, 0.45 * Math.pow(0.82, n - 4)) };
}
// tek balıktan geriye doğru üretim: her tahtanın en az bir çözümü olur
function revGen(sp, r) {
  const { cols, rows, fish, maxS } = sp, N = cols * rows, nb = makeNb(cols, rows), s = new Array(N).fill(0);
  s[Math.floor(r() * N)] = maxS;
  let c = 1;
  for (let guard = 0; c < fish && guard < 400; guard++) {
    const cand = [];
    for (let i = 0; i < N; i++) if (s[i] > 1 && nb[i].some(j => !s[j])) cand.push(i);
    if (!cand.length) break;
    const a = cand[Math.floor(r() * cand.length)], em = nb[a].filter(j => !s[j]), t = em[Math.floor(r() * em.length)];
    s[t] = s[a]; s[a] = 1 + Math.floor(r() * (s[t] - 1)); c++;
  }
  return c === fish ? crop(s, cols, rows) : null;
}
function crop(s, cols, rows) {
  let x0 = cols, x1 = -1, y0 = rows, y1 = -1;
  s.forEach((v, i) => { if (!v) return; const x = i % cols, y = (i / cols) | 0; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); });
  const out = [];
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) out.push(s[y * cols + x]);
  return { cols: x1 - x0 + 1, rows: y1 - y0 + 1, s: out };
}
// dik ekrana uysun: geniş tahtayı çevir (komşuluk aynı kalır)
function portrait(L) {
  if (L.cols <= L.rows || L.rows === 1) return L;
  const s = new Array(L.s.length);
  for (let y = 0; y < L.rows; y++) for (let x = 0; x < L.cols; x++) s[x * L.rows + y] = L.s[y * L.cols + x];
  return { cols: L.rows, rows: L.cols, s };
}
const levelCache = new Map();
function buildLevel(n) {
  if (levelCache.has(n)) return levelCache.get(n);
  let L;
  if (n <= HAND.length) L = HAND[n - 1];
  else {
    const sp = spec(n), r = rng(n * 7919 + 17), want = sp.fish > 10 ? 12 : sp.fish > 8 ? 24 : sp.fish > 6 ? 40 : 60;
    let best = null, bestScore = Infinity, got = 0;
    for (let k = 0; k < 400 && got < want; k++) {
      const g = revGen(sp, r); if (!g) continue;
      const nb = makeNb(g.cols, g.rows), p = analyzer(nb)(g.s);
      if (p <= 0 || p >= 1) continue;
      got++;
      const score = Math.abs(Math.log(p) - Math.log(sp.target)) - (greedyFails(g.s, nb) ? 0.35 : 0);
      if (score < bestScore) { bestScore = score; best = g; }
    }
    L = portrait(best || HAND[2]);
  }
  levelCache.set(n, L);
  return L;
}

// ---------- ses ve titreşim ----------
let ac = null;
function audio() {
  if (!store.sound) return null;
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
  if (ac.state === 'suspended') ac.resume().catch(() => {});
  return ac;
}
function tone(f0, f1, dur, type = 'sine', vol = .18, delay = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
}
const sfx = {
  eat: v => { tone(760 - v * 80, 150, .15, 'sine', .22); tone(1300, 700, .05, 'triangle', .05, .03); },
  sel: () => tone(880, 1000, .05, 'sine', .05),
  bad: () => tone(210, 190, .09, 'square', .03),
  stuck: () => tone(260, 170, .4, 'sine', .12),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f * 1.01, .24, 'triangle', .13, i * .09)),
};
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

// ---------- oyun durumu ----------
let lv, nb, ana, initial, cells, hist, used, sel = null, won = false, ids = 0, CS = 64, hintMove = null;
const fishEls = new Map();
const sizes = () => cells.map(c => c ? c.v : 0);

function loadLevel(n, snap) {
  store.level = n; persist();
  const L = buildLevel(n);
  lv = { n, cols: L.cols, rows: L.rows };
  nb = makeNb(L.cols, L.rows); ana = analyzer(nb);
  initial = L.s.map(v => v ? { id: ++ids, v } : null);
  cells = snap ? snap.cells : initial.map(c => c && { ...c });
  hist = snap ? snap.hist : [];
  used = snap ? snap.used : { hint: false, undo: false };
  won = false; sel = null; hintMove = null;
  buildBoard();
  render(true);
  if (snap && snap.won && count(sizes()) === 1) finish(true); else updateUI();
  setTimeout(() => buildLevel(n + 1), 350);
}

function buildBoard() {
  boardEl.innerHTML = '';
  fishEls.clear();
  layout();
  const cl = document.createElement('div');
  for (let i = 0; i < lv.cols * lv.rows; i++) { const c = document.createElement('div'); c.className = 'cell'; c.dataset.i = i; cl.appendChild(c); }
  boardEl.appendChild(cl);
  boardEl.appendChild(Object.assign(document.createElement('div'), { id: 'fishes' }));
  boardEl.appendChild(Object.assign(document.createElement('div'), { className: 'fx', id: 'fx' }));
  placeCells();
  if (lv.n === 1 && !hist.length) showFinger();
}
function layout() {
  const r = areaEl.getBoundingClientRect();
  CS = Math.max(36, Math.floor(Math.min((r.width - 20) / lv.cols, (r.height - 20) / lv.rows, 108)));
  boardEl.style.setProperty('--cs', CS + 'px');
  boardEl.style.width = CS * lv.cols + 'px';
  boardEl.style.height = CS * lv.rows + 'px';
}
const xy = i => [(i % lv.cols) * CS, ((i / lv.cols) | 0) * CS];
function placeCells() { boardEl.querySelectorAll('.cell').forEach(c => { const [x, y] = xy(+c.dataset.i); c.style.transform = `translate(${x}px,${y}px)`; }); }
function place(el, i, ox = 0, oy = 0) { const [x, y] = xy(i); el.style.transform = `translate(${x + ox}px,${y + oy}px)`; }
const cellEl = i => boardEl.querySelector(`.cell[data-i="${i}"]`);

function fishEl(c) {
  const el = document.createElement('div');
  el.className = 'fish s' + c.v;
  el.style.setProperty('--d', (-(c.id * 0.77) % 3.4).toFixed(2) + 's');
  el.innerHTML = `<div class="fb"><div class="bob"><svg viewBox="0 0 100 70" aria-hidden="true">
    <path class="tail" d="M70 35 L97 13 Q91 35 97 57 Z"/><path class="fin" d="M34 14 Q48 0 62 15 Z"/>
    <ellipse class="body" cx="42" cy="35" rx="35" ry="25"/><ellipse class="belly" cx="40" cy="46" rx="24" ry="9"/>
    <circle class="eye" cx="21" cy="29" r="6.5"/><circle class="pupil" cx="19.5" cy="29" r="3.2"/></svg>
    <span class="num">${c.v}</span></div></div>`;
  return el;
}
function render(instant) {
  const layer = $('#fishes'), present = new Set();
  cells.forEach((c, i) => {
    if (!c) return;
    present.add(c.id);
    let el = fishEls.get(c.id);
    if (!el) {
      el = fishEl(c); layer.appendChild(el); fishEls.set(c.id, el);
      el.style.transition = 'none'; place(el, i); void el.offsetWidth; el.style.transition = '';
      if (!instant) el.classList.add('pop');
    } else place(el, i);
    el.dataset.i = i;
  });
  for (const [id, el] of fishEls) if (!present.has(id)) { el.remove(); fishEls.delete(id); }
}

// ---------- hamleler ----------
const canEat = (i, j) => j >= 0 && cells[i] && cells[j] && cells[j].v < cells[i].v && nb[i].includes(j);
const targets = i => cells[i] ? nb[i].filter(j => canEat(i, j)) : [];
function neighbor(i, dir) {
  const x = i % lv.cols, y = (i / lv.cols) | 0;
  if (dir === 'l') return x > 0 ? i - 1 : -1;
  if (dir === 'r') return x < lv.cols - 1 ? i + 1 : -1;
  if (dir === 'u') return y > 0 ? i - lv.cols : -1;
  return y < lv.rows - 1 ? i + lv.cols : -1;
}
function clearMarks() {
  boardEl.querySelectorAll('.cell.t, .cell.go').forEach(c => c.classList.remove('t', 'go'));
  for (const el of fishEls.values()) el.classList.remove('sel');
}
function clearHint() {
  hintMove = null;
  boardEl.querySelectorAll('.cell.h').forEach(c => c.classList.remove('h'));
  for (const el of fishEls.values()) el.classList.remove('hint');
}
function select(i) {
  clearMarks(); sel = i;
  const el = fishEls.get(cells[i].id); el.classList.add('sel');
  const ts = targets(i);
  ts.forEach(j => cellEl(j).classList.add('t'));
  if (!ts.length) { wiggle(el); sfx.bad(); } else sfx.sel();
}
function deselect() { sel = null; clearMarks(); }
function wiggle(el) { el.classList.remove('wig'); void el.offsetWidth; el.classList.add('wig'); }

function eat(i, j) {
  clearHint();
  hist.push(cells.map(c => c && { ...c }));
  const eater = cells[i], prey = cells[j];
  cells[j] = eater; cells[i] = null;
  deselect();
  const el = fishEls.get(eater.id), pel = fishEls.get(prey.id);
  const dx = (j % lv.cols) - (i % lv.cols);
  if (dx) el.dataset.face = dx > 0 ? 'r' : 'l';
  el.classList.remove('drag');
  place(el, j); el.dataset.i = j;
  if (pel) { pel.classList.add('gone'); fishEls.delete(prey.id); setTimeout(() => pel.remove(), 230); }
  setTimeout(() => { el.classList.remove('chomp'); void el.offsetWidth; el.classList.add('chomp'); bubbles(j, 3 + prey.v); }, 110);
  sfx.eat(eater.v); buzz(12);
  hideFinger();
  updateUI();
  setTimeout(afterMove, 240);
}
function afterMove() {
  const s = sizes();
  if (count(s) === 1) return finish();
  if (ana(s) === 0) { sfx.stuck(); buzz([20, 50, 20]); }
  updateUI();
}
function finish(silent) {
  won = true; deselect(); clearHint();
  const stars = !used.hint && !used.undo ? 3 : !used.hint ? 2 : 1;
  store.best[lv.n] = Math.max(store.best[lv.n] || 0, stars); persist();
  $('#wstars').innerHTML = [1, 2, 3].map(k => `<span class="${k <= stars ? 'on' : ''}">★</span>`).join('');
  $('#wstars').setAttribute('aria-label', stars + ' yıldız');
  $('#c1').textContent = (used.hint ? '✗ ' : '✓ ') + 'İpucusuz'; $('#c1').className = used.hint ? '' : 'ok';
  $('#c2').textContent = (used.undo ? '✗ ' : '✓ ') + 'Geri almadan'; $('#c2').className = used.undo ? '' : 'ok';
  $('#wint').textContent = stars === 3 ? 'Kusursuz! Tek balık kaldı.' : 'Tek balık kaldı!';
  if (!silent) {
    const last = cells.findIndex(Boolean), el = fishEls.get(cells[last].id);
    el.classList.add('happy'); bubbles(last, 14);
    sfx.win(); buzz(30);
  }
  updateUI();
  if (!silent) setTimeout(() => $('#nextb').focus({ preventScroll: true }), 50);
}

function undo() {
  if (!hist.length) return;
  used.undo = true; won = false;
  cells = hist.pop(); deselect(); clearHint();
  render(false); updateUI();
}
function reset() {
  if (!hist.length && !won) return;
  cells = initial.map(c => c && { ...c }); hist = []; used.undo = false; won = false;
  deselect(); clearHint(); render(false); updateUI();
}
function hint() {
  if (won) return;
  const s = sizes();
  if (ana(s) === 0) { const u = $('#undo'); u.classList.remove('pulse'); void u.offsetWidth; u.classList.add('pulse'); return; }
  let best = null, bp = -1;
  for (const mv of moves(s, nb)) { const p = ana(apply(s, mv)); if (p > bp) { bp = p; best = mv; } }
  if (!best) return;
  used.hint = true; deselect(); clearHint();
  hintMove = best;
  fishEls.get(cells[best[0]].id).classList.add('hint');
  cellEl(best[1]).classList.add('h');
}

function bubbles(i, n) {
  const fx = $('#fx'); if (!fx) return;
  const [x, y] = xy(i);
  for (let k = 0; k < n; k++) {
    const b = document.createElement('div'); b.className = 'bub';
    const sz = 6 + Math.random() * 10;
    b.style.cssText = `left:${x + CS / 2 + (Math.random() - .5) * CS * .5}px;top:${y + CS / 2 + (Math.random() - .5) * CS * .4}px;width:${sz}px;height:${sz}px;--bx:${(Math.random() - .5) * CS * .6}px;--by:${-CS * (.5 + Math.random() * .7)}px;animation-delay:${Math.random() * .12}s`;
    fx.appendChild(b); setTimeout(() => b.remove(), 1000);
  }
}
let fingerEl = null;
function showFinger() {
  const from = cells.findIndex(c => c && c.v === 2), to = cells.findIndex(c => c && c.v === 1);
  if (from < 0 || to < 0) return;
  const [x0, y0] = xy(from), [x1, y1] = xy(to);
  fingerEl = document.createElement('div'); fingerEl.className = 'finger';
  fingerEl.style.cssText = `--x0:${x0 + CS / 2}px;--y0:${y0 + CS * .62}px;--x1:${x1 + CS / 2}px;--y1:${y1 + CS * .62}px`;
  boardEl.appendChild(fingerEl);
}
function hideFinger() { if (fingerEl) { fingerEl.remove(); fingerEl = null; } }

// ---------- arayüz ----------
function updateUI() {
  const s = sizes(), n = count(s), stuck = !won && n > 1 && ana(s) === 0;
  $('#lvn').textContent = lv.n;
  const b = store.best[lv.n] || 0;
  $('#lvs').textContent = b ? '★'.repeat(b) : '';
  $('#cnt').textContent = n;
  $('#prev').disabled = lv.n <= 1;
  $('#undo').disabled = !hist.length;
  $('#reset').disabled = !hist.length;
  $('#hint').disabled = stuck;
  $('#undo').classList.toggle('pulse', stuck);
  boardEl.classList.toggle('stuck', stuck);
  $('#stuck').hidden = !stuck;
  $('#dock').hidden = won;
  $('#win').hidden = !won;
}

// ---------- dokunma ----------
let drag = null;
function cellAt(e) {
  const r = boardEl.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / CS), y = Math.floor((e.clientY - r.top) / CS);
  return x < 0 || y < 0 || x >= lv.cols || y >= lv.rows ? -1 : y * lv.cols + x;
}
boardEl.addEventListener('pointerdown', e => {
  if (won || drag) return;
  audio(); hideFinger();
  const i = cellAt(e); if (i < 0) return;
  drag = { i, x0: e.clientX, y0: e.clientY, moved: false, j: -1, el: cells[i] ? fishEls.get(cells[i].id) : null };
  boardEl.setPointerCapture(e.pointerId);
});
boardEl.addEventListener('pointermove', e => {
  if (!drag || !drag.el) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moved) {
    if (Math.hypot(dx, dy) < 9) return;
    drag.moved = true; clearHint(); select(drag.i); drag.el.classList.add('drag');
  }
  const horiz = Math.abs(dx) > Math.abs(dy), amt = horiz ? dx : dy;
  const j = neighbor(drag.i, horiz ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u'));
  const ok = canEat(drag.i, j), lim = ok ? CS * .85 : CS * .16;
  const a = Math.max(-lim, Math.min(lim, amt));
  place(drag.el, drag.i, horiz ? a : 0, horiz ? 0 : a);
  if (horiz && ok) drag.el.dataset.face = dx > 0 ? 'r' : 'l';
  const go = ok && Math.abs(a) > CS * .36 ? j : -1;
  if (go !== drag.j) {
    if (drag.j >= 0) cellEl(drag.j).classList.remove('go');
    if (go >= 0) cellEl(go).classList.add('go');
    drag.j = go;
  }
});
function endDrag(e, cancel) {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved) {
    d.el.classList.remove('drag');
    if (!cancel && d.j >= 0) eat(d.i, d.j);
    else { place(d.el, d.i); deselect(); if (!cancel) sfx.bad(); }
    return;
  }
  if (cancel) return;
  if (sel !== null && sel !== d.i && canEat(sel, d.i)) { eat(sel, d.i); return; }
  if (cells[d.i]) { if (sel === d.i) deselect(); else { clearHint(); select(d.i); } }
  else deselect();
}
boardEl.addEventListener('pointerup', e => endDrag(e, false));
boardEl.addEventListener('pointercancel', e => endDrag(e, true));

$('#undo').addEventListener('click', undo);
$('#reset').addEventListener('click', reset);
$('#hint').addEventListener('click', hint);
$('#nextb').addEventListener('click', () => loadLevel(lv.n + 1));
$('#prev').addEventListener('click', () => lv.n > 1 && loadLevel(lv.n - 1));
$('#next').addEventListener('click', () => loadLevel(lv.n + 1));
function paintSound() { $('#sndw').style.display = store.sound ? '' : 'none'; $('#snd').setAttribute('aria-label', store.sound ? 'Sesi kapat' : 'Sesi aç'); }
$('#snd').addEventListener('click', () => { store.sound = !store.sound; persist(); paintSound(); if (store.sound) sfx.sel(); });
paintSound();

new ResizeObserver(() => {
  if (!lv) return;
  layout(); placeCells();
  cells.forEach((c, i) => { if (c && fishEls.get(c.id)) { const el = fishEls.get(c.id); el.style.transition = 'none'; place(el, i); void el.offsetWidth; el.style.transition = ''; } });
  if (fingerEl) { hideFinger(); showFinger(); }
}).observe(areaEl);

// test kancası
window.__balik = { buildLevel, spec, makeNb, analyzer, greedyFails, state: () => ({ lv, cells, hist, used, won }) };

window.claude?.hot?.snapshot?.(() => ({ level: lv.n, cells, hist, used, won, ids }));
const start = data => {
  if (data && data.level && Array.isArray(data.cells)) { ids = data.ids || 0; loadLevel(data.level, data); }
  else loadLevel(Math.max(1, store.level | 0 || 1));
};
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
