<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1120">
<title data-en="Ray — Metro Puzzle">Ray — Metro Bulmaca</title>
<meta name="description" content="Hatları bağla, şehri canlandır. Tek elle, internetsiz oynanan sakin metro bulmacası.">
<meta property="og:type" content="website">
<meta property="og:title" content="Ray — Metro Bulmaca">
<meta property="og:description" content="Hatları bağla, şehri canlandır. Günün Hattı'nı kaç hamlede bitirirsin?">
<meta property="og:image" content="https://osmanadali.github.io/mobil-oyun/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="glow g1"></i><i class="glow g2"></i><i class="glow g3"></i><i class="map"><svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M-20 130H130L250 250V520L350 620H440" stroke="#f0a64a"/><path d="M70-20V200L190 320H420" stroke="#4fc3a1"/><path d="M-20 470H120L220 370H320L420 270" stroke="#6ea8ff"/><path d="M110 820V650L210 550H300V320" stroke="#ff7a8a"/><path d="M-20 720H90L190 820" stroke="#b394ff"/><path d="M310-20V110L420 220" stroke="#4fc3a1"/></g><g class="st" fill="#fff" stroke="#8892a6" stroke-width="5"><circle cx="130" cy="130" r="11"/><circle cx="250" cy="320" r="11"/><circle cx="350" cy="620" r="11"/><circle cx="70" cy="200" r="11"/><circle cx="120" cy="470" r="11"/><circle cx="320" cy="370" r="11"/><circle cx="210" cy="550" r="11"/><circle cx="300" cy="420" r="11"/><circle cx="90" cy="720" r="11"/><circle cx="310" cy="110" r="11"/></g><g class="ctr"><rect x="-26" y="-9" width="52" height="18" rx="7"/><animateMotion dur="2.6s" begin="indefinite" fill="freeze" rotate="auto" path="M0 0"/></g></svg></i></div>
<div id="app">
  <div id="intro" class="intro" aria-hidden="true">
    <svg class="ilogo" viewBox="-10 -10 220 140">
      <path class="iln a" d="M14 92H62L98 56H186"/><path class="iln b" d="M98 10V56L134 92H186"/><path class="iln c" d="M14 30H54L98 56"/>
      <rect class="ihub" x="85" y="43" width="26" height="26" rx="8"/><circle class="ihubdot" cx="98" cy="56" r="4.5"/>
      <circle class="ist" style="--d:.95s" cx="14" cy="92" r="8"/><circle class="ist" style="--d:1.05s" cx="14" cy="30" r="8"/><circle class="ist" style="--d:1.15s" cx="98" cy="10" r="8"/><circle class="ist" style="--d:1.25s" cx="186" cy="56" r="8"/><circle class="ist" style="--d:1.35s" cx="186" cy="92" r="8"/>
    </svg>
    <h1 class="ititle">Ray</h1><p class="isub" data-en="Connect the lines · Light up the city">Hatları bağla · Şehri canlandır</p>
  </div>
  <section id="home" class="screen active">
    <header class="top">
      <button class="chip" id="streakChip" aria-label="Seri" data-en-label="Streak"><svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 .2 1.8 1 3 2.2 3.3C11 8.6 11.3 5 12 2z"/></svg><b id="sStreak">0</b></button>
      <button class="chip" id="starsChip" aria-label="Yıldızlar" data-en-label="Stars"><svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg><b id="sStars">0</b></button>
      <button class="chip crown" id="crownChip" aria-label="Renk temaları" data-en-label="Color themes"><i>👑</i><b id="sCrowns">0</b></button>
      <button class="ic" id="bSettings" aria-label="Ayarlar" data-en-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </header>

    <div class="hero">
      <!-- uygulama ikonunun işareti (Gece Işığı): duraktan L ray, yanan kare merkez; ray rengi temayı izler -->
      <svg class="logo mark" viewBox="0 0 120 120" aria-hidden="true">
        <path class="ln lr" d="M34 88V42H80"/>
        <circle class="st s1" cx="34" cy="88" r="10"/>
        <rect class="hub" x="61" y="23" width="38" height="38" rx="11"/>
        <circle class="hc" cx="80" cy="42" r="5.5"/>
      </svg>
      <h1>Ray</h1>
      <p data-en="Connect the lines · Light up the city">Hatları bağla · Şehri canlandır</p>
    </div>

    <div class="cards">
      <button class="card daily btn" id="bDaily">
        <span class="k" id="dailyK">GÜNÜN HATTI</span>
        <b id="dailyTitle">Hazır</b>
        <small id="dailyState">Seriyi koru</small>
        <svg class="arrow" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <button class="card prog btn" id="bMap">
        <div class="ph"><span class="k" data-en="LINES">HATLAR</span><small><b id="sHints">3</b> <span id="sHintsL">ipucu</span></small></div>
        <b id="lineName">M1 · Turuncu Hat</b>
        <div class="pb"><i id="progBar"></i></div>
        <div class="ph"><small id="gateTxt">★ 0 / 22 → M2</small><small id="sSize">3×3 ızgara</small></div>
      </button>
    </div>

    <div class="actions">
      <button id="bPlay" class="btn primary"><span data-en="Play">Oyna</span><small id="hLvl">Bölüm <span id="hLevel">1</span></small></button>
    </div>
  </section>

  <section id="game" class="screen">
    <header class="top">
      <button id="bBack" class="ic" aria-label="Geri" data-en-label="Back"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <div class="title"><b id="gTitle">Bölüm 1</b><small id="gMoves"></small></div>
      <button id="bReset" class="ic" aria-label="Baştan" data-en-label="Restart"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4.5h4.5"/></svg></button>
    </header>
    <div class="status">
      <div class="pill" id="gPill"><span id="gStars"><i>★</i><i>★</i><i>★</i></span><em id="gCombo" class="cmb" hidden></em></div>
      <div class="trip" id="gTrip"><div class="trk" aria-hidden="true"><i class="done"></i><i class="peron"></i><i class="sig"></i><div class="mv" id="gTrain"></div></div><small id="gNext">⏱ 0:30</small><span class="bub" id="gBub" role="status"></span></div>
    </div>
    <div id="board"><canvas id="cv" role="img" aria-label="Oyun tahtası: karolara dokunarak döndür, bütün durakları merkeze bağla" data-en-label="Game board: tap tiles to turn them and connect every station to the hub"></canvas></div>
    <div id="winPanel" class="winp"></div>
    <footer class="bottom">
      <div class="parInfo"><span id="gParLbl">HAMLE</span><b id="gPar">0</b></div>
      <!-- güçlendiriciler: yalnız işe yaradığı an görünür (bstUi) -->
      <div class="bsts"><button id="gUndo" class="bst" hidden aria-label="Geri al" data-en-label="Undo">↶<b></b></button><button id="gLamp" class="bst" hidden aria-label="Fener" data-en-label="Lantern">🔦<b></b></button><button id="gPlus" class="bst" hidden aria-label="+15 sn" data-en-label="+15 s">⏱<i>+15</i><b></b></button></div>
      <button id="bHint" class="btn hint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.2 1.1 2.2h5c0-1 .5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg><span data-en="Hint">İpucu</span><b id="gHints">3</b></button>
    </footer>
  </section>

  <section id="map" class="screen">
    <header class="top">
      <button id="pBack" class="ic" aria-label="Geri" data-en-label="Back"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <div class="title"><b data-en="Lines">Hatlar</b><small id="pSub"></small></div>
      <div class="chip"><svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg><b id="pStars">0</b></div>
    </header>
    <div class="mapList" id="mapList"></div>
  </section>

  <div id="modal" class="modal"><div class="sheet" id="mCard"></div></div>
  <div id="toast"></div>
</div>
<script src="i18n.js"></script>
<script src="ads.js"></script>
<script src="shop.js"></script>
<script src="rules/makas.js"></script>
<script src="rules/kapak.js"></script>
<script src="rules/kopru.js"></script>
<script src="rules/silik-kol.js"></script>
<script src="rules/tabela.js"></script>
<script src="rules/gizli-depo.js"></script>
<script src="rules/doner-tabla.js"></script>
<script src="rules/kapali-durak.js"></script>
<script src="rules/halka.js"></script>
<script src="rules/nehir.js"></script>
<script src="rules/tunel-agzi.js"></script>
<script src="rules/tarife-bolgesi.js"></script>
<script src="rules/soguyan-karo.js"></script>
<script src="rules/bakim-karosu.js"></script>
<script src="rules/kayan-sira.js"></script>
<script src="game.js"></script>
</body>
</html>
