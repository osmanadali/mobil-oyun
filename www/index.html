<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#15171b">
<title>Ray — Metro Bulmaca</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="home" class="screen active">
    <div class="brand"><div class="logo"></div><h1>Ray</h1><p>Hatları bağla. Şehri yak.</p></div>
    <div class="stats">
      <div><b id="sStars">0</b><span>yıldız</span></div>
      <div><b id="sStreak">0</b><span>gün seri</span></div>
      <div><b id="sHints">3</b><span>ipucu</span></div>
    </div>
    <div class="actions">
      <button id="bDaily" class="btn ghost">Günün Hattı <small id="dailyState"></small></button>
      <button id="bPlay" class="btn primary">Oyna · Bölüm <span id="hLevel">1</span></button>
      <div class="row"><button id="bSettings" class="btn ghost sm">Ayarlar</button><button id="bHow" class="btn ghost sm">Nasıl?</button></div>
    </div>
  </section>

  <section id="game" class="screen">
    <header class="bar">
      <button id="bBack" class="ic" aria-label="Geri">‹</button>
      <div class="title"><b id="gTitle">Bölüm 1</b><small id="gMoves">0 / 0 hamle</small></div>
      <span class="ic"></span>
    </header>
    <div id="board"><canvas id="cv"></canvas></div>
    <footer class="bar bottom">
      <button id="bReset" class="btn ghost sm">Baştan</button>
      <button id="bHint" class="btn ghost sm">İpucu <span id="gHints">3</span></button>
    </footer>
  </section>

  <div id="modal" class="modal"><div class="card" id="mCard"></div></div>
  <div id="toast"></div>
</div>
<script src="ads.js"></script>
<script src="game.js"></script>
</body>
</html>
