<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1120">
<title>Ray — Metro Bulmaca</title>
<meta name="description" content="Hatları bağla, şehri canlandır. Tek elle, internetsiz oynanan sakin metro bulmacası.">
<meta property="og:type" content="website">
<meta property="og:title" content="Ray — Metro Bulmaca">
<meta property="og:description" content="Hatları bağla, şehri canlandır. Günün Hattı'nı kaç hamlede bitirirsin?">
<meta property="og:image" content="https://osmanadali.github.io/mobil-oyun/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="glow g1"></i><i class="glow g2"></i><i class="glow g3"></i><i class="map"></i></div>
<div id="app">
  <div id="intro" class="intro" aria-hidden="true">
    <svg class="ilogo" viewBox="-10 -10 220 140">
      <path class="iln a" d="M14 92H62L98 56H186"/><path class="iln b" d="M98 10V56L134 92H186"/><path class="iln c" d="M14 30H54L98 56"/>
      <rect class="ihub" x="85" y="43" width="26" height="26" rx="8"/><circle class="ihubdot" cx="98" cy="56" r="4.5"/>
      <circle class="ist" style="--d:.95s" cx="14" cy="92" r="8"/><circle class="ist" style="--d:1.05s" cx="14" cy="30" r="8"/><circle class="ist" style="--d:1.15s" cx="98" cy="10" r="8"/><circle class="ist" style="--d:1.25s" cx="186" cy="56" r="8"/><circle class="ist" style="--d:1.35s" cx="186" cy="92" r="8"/>
    </svg>
    <h1 class="ititle">Ray</h1><p class="isub">Hatları bağla · Şehri canlandır</p>
  </div>
  <section id="home" class="screen active">
    <header class="top">
      <button class="chip" id="streakChip" aria-label="Seri"><svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 .2 1.8 1 3 2.2 3.3C11 8.6 11.3 5 12 2z"/></svg><b id="sStreak">0</b></button>
      <button class="chip" id="starsChip" aria-label="Yıldızlar"><svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg><b id="sStars">0</b></button>
      <button class="chip crown" id="crownChip" aria-label="Renk temaları"><i>👑</i><b id="sCrowns">0</b></button>
      <button class="ic" id="bSettings" aria-label="Ayarlar"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </header>

    <div class="hero">
      <svg class="logo" viewBox="0 0 200 120" aria-hidden="true">
        <path class="ln l1" d="M14 92H62L98 56H186"/>
        <path class="ln l2" d="M98 10V56L134 92H186"/>
        <path class="ln l3" d="M14 30H54L98 56"/>
        <rect class="hub" x="86" y="44" width="24" height="24" rx="7"/>
        <circle class="st s1" cx="14" cy="92" r="7"/><circle class="st s2" cx="186" cy="56" r="7"/>
        <circle class="st s3" cx="98" cy="10" r="7"/><circle class="st s4" cx="186" cy="92" r="7"/><circle class="st s5" cx="14" cy="30" r="7"/>
      </svg>
      <h1>Ray</h1>
      <p>Hatları bağla · Şehri canlandır</p>
    </div>

    <div class="cards">
      <button class="card daily btn" id="bDaily">
        <span class="k" id="dailyK">GÜNÜN HATTI</span>
        <b id="dailyTitle">Hazır</b>
        <small id="dailyState">Seriyi koru</small>
        <svg class="arrow" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <button class="card prog btn" id="bMap">
        <div class="ph"><span class="k">HATLAR</span><small><b id="sHints">3</b> ipucu</small></div>
        <b id="lineName">M1 · Turuncu Hat</b>
        <div class="pb"><i id="progBar"></i></div>
        <div class="ph"><small id="gateTxt">★ 0 / 22 → M2</small><small id="sSize">3×3 ızgara</small></div>
      </button>
    </div>

    <div class="actions">
      <button id="bPlay" class="btn primary"><span>Oyna</span><small>Bölüm <span id="hLevel">1</span></small></button>
      <button id="bHow" class="link">Nasıl oynanır?</button>
    </div>
  </section>

  <section id="game" class="screen">
    <header class="top">
      <button id="bBack" class="ic" aria-label="Geri"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <div class="title"><b id="gTitle">Bölüm 1</b><small id="gMoves">0 hamle · hedef 0</small></div>
      <button id="bReset" class="ic" aria-label="Baştan"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4.5h4.5"/></svg></button>
    </header>
    <div class="status">
      <div class="pill" id="gPill"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg><b id="gTime">0:00</b><span id="gStars"><i>★</i><i>★</i><i>★</i></span><em id="gCombo" class="cmb" hidden></em></div>
      <div class="trip" id="gTrip"><div class="trk" aria-hidden="true"><i class="done"></i><i class="peron"></i><i class="sig"></i><div class="mv" id="gTrain"></div></div><small id="gNext">⏱ 0:30</small><span class="bub" id="gBub" role="status"></span></div>
    </div>
    <div class="meter"><i id="gBar"></i><span id="gPct">0%</span></div>
    <div id="board"><canvas id="cv"></canvas></div>
    <div id="winPanel" class="winp"></div>
    <footer class="bottom">
      <div class="parInfo"><span id="gParLbl">HAMLE</span><b id="gPar">0</b></div>
      <button id="bHint" class="btn hint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.2 1.1 2.2h5c0-1 .5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>İpucu<b id="gHints">3</b></button>
    </footer>
  </section>

  <section id="map" class="screen">
    <header class="top">
      <button id="pBack" class="ic" aria-label="Geri"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <div class="title"><b>Hatlar</b><small id="pSub"></small></div>
      <div class="chip"><svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg><b id="pStars">0</b></div>
    </header>
    <div class="mapList" id="mapList"></div>
  </section>

  <div id="modal" class="modal"><div class="sheet" id="mCard"></div></div>
  <div id="toast"></div>
</div>
<script src="ads.js"></script>
<script src="shop.js"></script>
<script src="rules/makas.js"></script>
<script src="rules/kopru.js"></script>
<script src="rules/tabela.js"></script>
<script src="rules/doner-tabla.js"></script>
<script src="rules/halka.js"></script>
<script src="rules/tunel-agzi.js"></script>
<script src="game.js"></script>
</body>
</html>
