<title>Küp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Küp">
<meta name="theme-color" content="#14161c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: tam ekran 3B sahne; üstüne katmanlı ekranlar (ana menü, bölüm haritası, oyun göstergesi), ayarlar alttan açılan sayfa. */
:root{
  --bg1:#eef0f4; --bg2:#d6dbe5; --ink:#1b1e26; --ink-soft:#5d6474;
  --panel:rgba(255,255,255,.80); --solid:#f6f7fa; --line:rgba(27,30,38,.10); --accent:#1652c4; --on-accent:#fff; --star:#f2b21b; --lock:rgba(27,30,38,.06);
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg1:#20242d;--bg2:#0d0f14;--ink:#eef0f5;--ink-soft:#9aa2b3;--panel:rgba(30,34,43,.80);--solid:#171a21;--line:rgba(255,255,255,.09);--accent:#4d8bff;--on-accent:#fff;--star:#ffc93c;--lock:rgba(255,255,255,.04);color-scheme:dark}
}
:root[data-theme="dark"]{--bg1:#20242d;--bg2:#0d0f14;--ink:#eef0f5;--ink-soft:#9aa2b3;--panel:rgba(30,34,43,.80);--solid:#171a21;--line:rgba(255,255,255,.09);--accent:#4d8bff;--on-accent:#fff;--star:#ffc93c;--lock:rgba(255,255,255,.04);color-scheme:dark}
/* Skin'ler kendi dünyasını taşır, sistem temasından bağımsız */
:root[data-skin="pastel"]{--bg1:#f7eef6;--bg2:#e0e7f7;--ink:#3b3552;--ink-soft:#7c7598;--panel:rgba(255,255,255,.74);--solid:#f6f1f8;--line:rgba(59,53,82,.11);--accent:#8b6fd3;--on-accent:#fff;--star:#f0a83a;--lock:rgba(59,53,82,.05);color-scheme:light}
:root[data-skin="neon"]{--bg1:#1d1650;--bg2:#05040d;--ink:#ecebff;--ink-soft:#9d98c9;--panel:rgba(18,15,40,.76);--solid:#0c0a1e;--line:rgba(160,150,255,.16);--accent:#2ec4ff;--on-accent:#04121c;--star:#f6f26a;--lock:rgba(160,150,255,.05);color-scheme:dark}
:root[data-skin="ahsap"]{--bg1:#2f4639;--bg2:#121b16;--ink:#f1e8d8;--ink-soft:#b3ab98;--panel:rgba(22,32,26,.78);--solid:#16201a;--line:rgba(241,232,216,.12);--accent:#e0b04a;--on-accent:#2a1c0c;--star:#e0b04a;--lock:rgba(241,232,216,.04);color-scheme:dark}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(120% 90% at 50% 40%,var(--bg1),var(--bg2));color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;transition:background .4s}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;outline:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:12}
button{font-family:inherit}
.scr{position:fixed;inset:0;z-index:3;pointer-events:none;transition:opacity .3s}
.scr.off{opacity:0;visibility:hidden}
.scr .pe{pointer-events:auto}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.chip{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 13px var(--f-body);height:40px;min-width:40px;padding:0 13px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-variant-numeric:tabular-nums}
.chip svg{width:18px;height:18px;flex:none}
.chip.ghost{background:transparent;border-color:transparent}
.star-i{color:var(--star)}
:is(.chip,.btn,.card,.seg button,.lv,.mode):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 14px var(--f-body);height:56px;border-radius:18px;padding:0 18px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .12s,opacity .2s}
.btn:active,.mode:active,.lv:active,.card:active{transform:scale(.96)}
.btn svg{width:20px;height:20px;flex:none}
.btn.sq{width:56px;padding:0}
.btn.main{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn[disabled]{opacity:.35;pointer-events:none}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font:800 11px var(--f-body);display:inline-grid;place-items:center}

/* --- ana menü --- */
#home .top{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
#home .top div{display:flex;gap:8px}
.logo{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 76px);text-align:center}
.logo h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(44px,13vw,64px);letter-spacing:.04em;line-height:1}
.logo p{margin:8px 0 0;color:var(--ink-soft);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.menu{position:absolute;inset:auto 0 0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;align-items:center;gap:10px}
.menu>*{width:min(420px,100%)}
.play{height:72px;border-radius:22px;flex-direction:column;gap:2px}
.play b{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.01em}
.play small{font-size:12px;opacity:.85;font-weight:600}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mode{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:18px;padding:12px 6px 11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;transition:transform .12s}
.mode svg{width:24px;height:24px}
.mode b{font-size:13px;font-weight:800}
.mode small{font-size:11px;color:var(--ink-soft);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mode .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* --- oyun göstergesi --- */
#play .top{position:absolute;inset:0 0 auto;display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.hud{text-align:center;min-width:0}
.hud .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:800}
.hud .big{font-family:var(--f-mono);font-weight:500;font-size:clamp(32px,8.5vw,42px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.hud .big span{color:var(--ink-soft);font-size:.6em}
.hud .sub{margin-top:4px;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.hud .sub b{color:var(--ink);font-weight:800}
.stars{display:inline-flex;gap:3px;vertical-align:middle}
.stars svg{width:14px;height:14px}
.st-on{fill:var(--star)} .st-off{fill:var(--line)}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 98px);font-size:13px;color:var(--ink-soft);text-align:center;width:min(340px,calc(100% - 32px));line-height:1.45;transition:opacity .4s;text-wrap:balance;font-weight:600}
.hint.off{opacity:0}
.hint.strong{color:var(--ink)}
.bar{position:absolute;inset:auto 0 0;display:flex;justify-content:center;gap:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
.bar .btn.wide{min-width:150px}

/* --- bölüm haritası --- */
#map{background:var(--solid)}
#map.scr{pointer-events:auto}
#map .head{display:flex;align-items:center;justify-content:space-between;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:10px}
#map .head h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:18px}
#map .scroll{position:absolute;inset:calc(env(safe-area-inset-top,0px) + 66px) 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
.grp{max-width:520px;margin:0 auto 22px}
.grp h3{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 10px;font-size:14px;font-weight:800}
.grp h3 small{font-size:12px;color:var(--ink-soft);font-weight:700;font-variant-numeric:tabular-nums}
.grp p{margin:-6px 2px 12px;font-size:12px;color:var(--ink-soft)}
.lvs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lv{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font:500 18px var(--f-mono);font-variant-numeric:tabular-nums;transition:transform .12s;max-width:100%}
.lv .stars svg{width:11px;height:11px}
.lv.next{background:var(--accent);color:var(--on-accent);border-color:transparent}
.lv.next .st-off{fill:rgba(255,255,255,.35)}
.lv[disabled]{background:var(--lock);color:var(--ink-soft);cursor:default}
.lv[disabled] svg.lk{width:16px;height:16px;opacity:.6}

/* --- alt sayfa --- */
.scrim{position:fixed;inset:0;z-index:8;background:rgba(5,6,10,.38);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;margin:0 auto;max-width:520px;background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto;
  padding-top:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet h2{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0;letter-spacing:.01em}
.sheet h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft);margin:18px 0 10px;font-weight:800}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.card{appearance:none;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:18px;padding:10px 6px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;font:700 12px var(--f-body);position:relative;transition:transform .12s}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card canvas{width:100%;max-width:76px;aspect-ratio:1;height:auto}
.card.locked canvas{filter:grayscale(1) brightness(.75);opacity:.55}
.card .need{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);background:var(--solid);color:var(--ink);border-radius:999px;padding:3px 8px;font:800 11px var(--f-body);display:flex;gap:3px;align-items:center;white-space:nowrap}
.card .need svg{width:11px;height:11px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:var(--line);padding:4px;border-radius:14px}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink);font:700 14px var(--f-body);height:40px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.note{font-size:12px;color:var(--ink-soft);margin:10px 2px 0;line-height:1.5;min-height:1.5em}
.sizes{display:grid;gap:10px}
.size{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;cursor:pointer;text-align:left}
.size .n{font-family:var(--f-display);font-weight:700;font-size:20px;width:58px}
.size .d{font-size:12px;color:var(--ink-soft);font-weight:600}
.size .d b{display:block;color:var(--ink);font-size:14px;font-weight:800;margin-bottom:2px}
.size .t{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.statgrid div{border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.statgrid small{display:block;font-size:11px;color:var(--ink-soft);font-weight:700;margin-bottom:3px}
.statgrid b{font-family:var(--f-mono);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}

/* --- sonuç kartı --- */
.win{position:fixed;left:50%;top:50%;z-index:10;width:min(330px,calc(100% - 40px));transform:translate(-50%,-42%) scale(.96);opacity:0;pointer-events:none;
  background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:28px;padding:22px 20px 18px;text-align:center;transition:all .45s cubic-bezier(.2,.8,.2,1)}
.win.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.win .k{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-soft);font-weight:800}
.win .bigstars{display:flex;justify-content:center;gap:6px;margin:12px 0 4px}
.win .bigstars svg{width:46px;height:46px;transform:scale(0);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.win .bigstars svg:nth-child(2){width:56px;height:56px;margin-top:-10px}
.win .bigstars svg.pop{transform:scale(1)}
.win .t{font-family:var(--f-mono);font-size:44px;font-weight:500;margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.win .m{font-size:14px;color:var(--ink-soft);font-weight:600}
.win .m b{color:var(--ink)}
.win .gifts{display:flex;flex-direction:column;gap:6px;margin-top:12px;align-items:center}
.win .gift{display:inline-flex;align-items:center;gap:6px;font:800 12px var(--f-body);letter-spacing:.03em;color:var(--on-accent);background:var(--accent);padding:6px 11px;border-radius:999px}
.win .gift svg{width:14px;height:14px}
.win .row{display:flex;gap:8px;margin-top:18px}
.win .row .btn{flex:1;height:52px;min-width:0;padding:0 10px}
.win .row .btn.sq{flex:none;width:52px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translate(-50%,-10px);z-index:11;background:var(--ink);color:var(--solid);font:700 13px var(--f-body);padding:10px 16px;border-radius:999px;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-height:640px){.logo{top:calc(env(safe-area-inset-top,0px) + 58px)}.logo h1{font-size:40px}.play{height:62px}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></symbol>
  <symbol id="i-mix" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></symbol>
  <symbol id="i-skin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><circle cx="17.25" cy="17.25" r="3.75"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M10 2h4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-fire" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-2.7 7-6.8 0-3.6-2.4-5.6-3.6-8.7-.5 2-1.6 3-2.6 3.4C12.9 6.6 11.2 4 8.6 2c.4 3.4-3.6 6.6-3.6 11.2C5 19.3 8 22 12 22z"/></symbol>
</svg>

<div id="stage" aria-label="Rubik küpü"></div>
<canvas id="fx"></canvas>

<!-- ana menü -->
<section class="scr" id="home">
  <div class="top gut">
    <div><button class="chip pe" id="hStars" aria-label="Toplam yıldız"><svg class="star-i"><use href="#i-star" fill="currentColor"/></svg><span>0</span></button>
      <button class="chip pe" id="hHints" aria-label="İpucu hakkı"><svg><use href="#i-bulb"/></svg><span>5</span></button></div>
    <div><button class="chip pe" id="hSkin" aria-label="Skin ve ayarlar"><svg><use href="#i-skin"/></svg></button></div>
  </div>
  <div class="logo"><h1>KÜP</h1><p id="hTag">Çevir · Eşle · Çöz</p></div>
  <div class="menu gut">
    <button class="btn main play pe" id="hPlay"><b id="hPlayT">Bölüm 1</b><small id="hPlayS">2×2 · 1 hamlede çöz</small></button>
    <div class="modes">
      <button class="mode pe" id="hMap"><svg><use href="#i-grid"/></svg><b>Bölümler</b><small id="hMapS">0/60</small></button>
      <button class="mode pe" id="hDaily"><svg><use href="#i-cal"/></svg><b>Günlük</b><small id="hDailyS">Hazır</small><i class="dot" id="hDailyDot"></i></button>
      <button class="mode pe" id="hSpeed"><svg><use href="#i-clock"/></svg><b>Rekor</b><small id="hSpeedS">Süreye karşı</small></button>
    </div>
  </div>
</section>

<!-- oyun -->
<section class="scr off" id="play">
  <div class="top gut">
    <button class="chip pe" id="pBack" aria-label="Menüye dön"><svg><use href="#i-back"/></svg></button>
    <div class="hud">
      <div class="lbl" id="pLbl">Bölüm 1</div>
      <div class="big" id="pBig">0<span> / 1</span></div>

  const dpr = Math.min(devicePixelRatio || 1, 2); fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; fg.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = SKINS[S.skin].stickers;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
    parts.push({ x: innerWidth / 2, y: innerHeight * .45, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5, r: Math.random() * 6, vr: (Math.random() - .5) * .4, s: 5 + Math.random() * 6, c: cols[i % 6], life: 1 });
  }
}
function stepFx() {
  if (!parts.length) return;
  fg.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.vy += .28; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .0065;
    fg.save(); fg.globalAlpha = Math.min(1, p.life * 2); fg.translate(p.x, p.y); fg.rotate(p.r); fg.fillStyle = p.c;
    fg.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .7); fg.restore();
  }
  if (!parts.length) fg.clearRect(0, 0, innerWidth, innerHeight);
}

/* ---------- döngü ---------- */
let spin = null, lastFrame = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(50, now - lastFrame); lastFrame = now;
  stepAnim(now); stepHint(now);
  if (!drag.mode && (Math.abs(vAz) > 1e-4 || Math.abs(vEl) > 1e-4)) {
    az += vAz; el = Math.max(-1.35, Math.min(1.35, el + vEl)); vAz *= .92; vEl *= .92; placeCamera(); dirty = true;
  }
  if (spin) {
    const t = Math.min(1, (now - spin.t0) / 1600);
    az = spin.az0 + Math.PI * 2 * (1 - Math.pow(1 - t, 3)); placeCamera(); dirty = true;
    if (t >= 1) spin = null;
  } else if (screen === 'home' && !drag.mode) { az += dt * .00022; placeCamera(); dirty = true; }
  const g = G();
  if (screen === 'play' && g && g.mode === 'speed' && g.phase === 'solving') $('pBig').textContent = fmt(curElapsed());
  stepFx();
  if (dirty) { renderer.render(scene, camera); dirty = false; }
}
document.addEventListener('visibilitychange', () => {
  const g = G(); if (document.hidden && g && g.phase === 'solving' && tStart) { g.elapsed = curElapsed(); tStart = performance.now(); save(); }
});
addEventListener('pagehide', () => { const g = G(); if (g && g.phase === 'solving' && tStart) { g.elapsed = curElapsed(); tStart = performance.now(); } save(); });

root.dataset.skin = S.skin;
makeMaterials();
build(3);
resize(); show('home'); requestAnimationFrame(loop);
window.__kup = { S, isSolved, enqueue, startLevel, startDaily, startSpeed, goHome, LEVELS, reduceStack, get screen() { return screen; } };
